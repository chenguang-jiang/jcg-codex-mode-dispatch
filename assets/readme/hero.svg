<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">jcg-codex-mode-dispatch</title>
  <desc id="hero-desc">A Codex CLI skill that splits large tasks into independent subtasks and runs them in parallel via codex exec, routing each to Luna or Sol with fail-closed dispatch and a hard startup gate.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9z" fill="#484f58"/>
    </marker>
    <marker id="arr-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L8,5 L0,9z" fill="#f7816680"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="24" fill="#0d1117"/>

  <!-- subtle terminal-line motif -->
  <g opacity="0.04" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4 8">
    <line x1="56" y1="80" x2="640" y2="80"/>
    <line x1="56" y1="120" x2="640" y2="120"/>
    <line x1="56" y1="160" x2="640" y2="160"/>
    <line x1="56" y1="200" x2="640" y2="200"/>
    <line x1="56" y1="240" x2="640" y2="240"/>
    <line x1="56" y1="280" x2="640" y2="280"/>
    <line x1="56" y1="320" x2="640" y2="320"/>
  </g>

  <!-- ═══ LEFT: title block ═══ -->
  <g transform="translate(56,52)">
    <!-- category eyebrow -->
    <rect width="148" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="12" y="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#8b949e" letter-spacing="1.5">CODEX CLI SKILL</text>

    <!-- project name -->
    <text y="68" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="700" fill="#f0f6fc">jcg-codex-mode-dispatch</text>

    <!-- one-line value -->
    <text y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" fill="#8b949e">Parallel multi-model dispatch with a hard startup gate</text>

    <!-- priority line -->
    <text y="142" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#58a6ff">accuracy &gt; latency &gt; cost</text>
    <!-- cursor motif -->
    <rect x="210" y="128" width="2" height="18" fill="#58a6ff" opacity="0.7"/>

    <!-- model chips -->
    <g transform="translate(0,168)">
      <rect width="108" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="16" cy="15" r="5" fill="#58a6ff"/>
      <text x="28" y="20" font-family="ui-monospace,monospace" font-size="13" fill="#c9d1d9">Luna</text>
      <text x="72" y="20" font-family="ui-monospace,monospace" font-size="11" fill="#484f58">verify</text>

      <rect x="120" width="88" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="136" cy="15" r="5" fill="#f78166"/>
      <text x="148" y="20" font-family="ui-monospace,monospace" font-size="13" fill="#c9d1d9">Sol</text>
      <text x="172" y="20" font-family="ui-monospace,monospace" font-size="11" fill="#484f58">strong</text>

      <rect x="220" width="96" height="30" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="236" cy="15" r="5" fill="#bc8cff"/>
      <text x="248" y="20" font-family="ui-monospace,monospace" font-size="13" fill="#c9d1d9">Terra</text>
      <text x="286" y="20" font-family="ui-monospace,monospace" font-size="11" fill="#484f58">opt</text>
    </g>

    <!-- metadata -->
    <text y="232" font-family="ui-monospace,monospace" font-size="12" fill="#484f58">bash 3.2+  ·  MIT  ·  19 tests passing  ·  hidden by default</text>
  </g>

  <!-- ═══ RIGHT: dispatch flow diagram ═══ -->
  <g transform="translate(700,28)">
    <!-- card background -->
    <rect x="0" y="0" width="444" height="344" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <!-- terminal header bar -->
    <rect x="0" y="0" width="444" height="32" rx="16" fill="#21262d"/>
    <rect x="0" y="16" width="444" height="16" fill="#21262d"/>
    <circle cx="20" cy="16" r="5" fill="#f8514960"/>
    <circle cx="38" cy="16" r="5" fill="#d2992260"/>
    <circle cx="56" cy="16" r="5" fill="#3fb95060"/>
    <text x="222" y="20" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#484f58">dispatch.sh</text>

    <!-- nodes -->
    <!-- MAIN -->
    <rect x="152" y="48" width="140" height="34" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="222" y="70" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#f0f6fc">MAIN THREAD</text>

    <!-- arrow MAIN → DISPATCH -->
    <line x1="222" y1="82" x2="222" y2="100" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- DISPATCH -->
    <rect x="142" y="102" width="160" height="34" rx="8" fill="#21262d" stroke="#58a6ff40" stroke-width="1.5"/>
    <text x="222" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#58a6ff">dispatch.sh</text>

    <!-- arrows DISPATCH → LUNA / SOL -->
    <path d="M182,136 C182,152 112,152 112,168" fill="none" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M262,136 C262,152 332,152 332,168" fill="none" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- LUNA -->
    <rect x="42" y="170" width="140" height="34" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="62" cy="187" r="5" fill="#58a6ff"/>
    <text x="76" y="192" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#58a6ff">LUNA  ∥</text>

    <!-- SOL -->
    <rect x="262" y="170" width="140" height="34" rx="8" fill="#0d1117" stroke="#f78166" stroke-width="1.5"/>
    <circle cx="282" cy="187" r="5" fill="#f78166"/>
    <text x="296" y="192" font-family="ui-monospace,monospace" font-size="13" font-weight="600" fill="#f78166">SOL  ∥</text>

    <!-- failover dashed arrow LUNA → SOL -->
    <line x1="182" y1="187" x2="260" y2="187" stroke="#f7816680" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-fail)"/>
    <text x="222" y="182" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#f7816680">failover</text>

    <!-- arrows LUNA/SOL → VERIFY -->
    <path d="M112,204 C112,220 182,220 182,236" fill="none" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M332,204 C332,220 262,220 262,236" fill="none" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- VERIFY -->
    <rect x="142" y="238" width="160" height="34" rx="8" fill="#21262d" stroke="#3fb95080" stroke-width="1.5"/>
    <text x="222" y="260" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#3fb950">VERIFY  $OUT</text>

    <!-- arrow VERIFY → REDUCE -->
    <line x1="222" y1="272" x2="222" y2="290" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- REDUCE -->
    <rect x="122" y="292" width="200" height="34" rx="8" fill="#21262d" stroke="#d2992280" stroke-width="1.5"/>
    <circle cx="142" cy="309" r="5" fill="#f78166"/>
    <text x="156" y="314" font-family="ui-monospace,monospace" font-size="13" fill="#d29922">REDUCE · Sol xhigh</text>
  </g>
</svg>
